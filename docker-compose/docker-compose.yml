name: EasyBank microservices
services:

  rabbit:
    image: "rabbitmq:4-management"
    container_name: rabbit_service
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in the env file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in the env file}
    extends:
      file: common-config.yml
      service: network-deploy-service

  configserver:
    image: "marcell13/configserver:${IMAGE_TAG:-${IMAGE_TAG:-${IMAGE_TAG:-s6}}}"
    container_name: configserver_service
    ports:
      - "8071:8071"
    volumes:
      - ${HOME}/.ssh/easybank:/root/.ssh:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8071 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      rabbit:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-base-config

  account:
    image: "marcell13/accounts:${IMAGE_TAG:-${IMAGE_TAG:-s6}}"
    container_name: account_service
    ports:
      - "8080:8080"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  loans:
    image: "marcell13/loans:${IMAGE_TAG:-${IMAGE_TAG:-s6}}"
    container_name: loans_service
    ports:
      - "8090:8090"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

  cards:
    image: "marcell13/cards:${IMAGE_TAG:-${IMAGE_TAG:-s6}}"
    container_name: cards_service
    ports:
      - "9000:9000"
    depends_on:
      configserver:
        condition: service_healthy
    extends:
      file: common-config.yml
      service: microservice-configserver-config

networks:
  easybank:
    driver: bridge
