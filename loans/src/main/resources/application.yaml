server:
  port: 8090
spring:
  application:
    name: loans
  profiles:
    active: uat
  datasource:
    url: "jdbc:mysql://localhost:3308/loansdb"
    username: root
    password: root
  jpa:
    show-sql: true
  sql:
    init:
      mode: always


  config:
    import: "optional:configserver:http://localhost:8071/"

  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/


management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true

info:
  app:
    name: "Loans Service"
    description: "This is the Loans Service for EasyBank Application"
    version: 1.0.0
        
logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

