server:
  port: 8080
spring:
  application:
    name: accounts
  profiles:
    active: uat

  datasource:
    url: "jdbc:h2:mem:testdb"
    driverClassName: "org.h2.Driver"
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: "org.hibernate.dialect.H2Dialect"
    hibernate:
      ddl-auto: update
    show-sql: true

#  datasource:
#    url: "jdbc:mysql://localhost:3306/accountsdb"
#    username: root
#    password: root
#
#  jpa:
#    show-sql: true
#
#  sql:
#    init:
#      mode: always

  config:
    import: "optional:configserver:http://localhost:8071/"

  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8070/eureka/

  http:
    ServiceClient:
      loans:
        base-url: lb://loans
      cards:
        base-url: lb://cards
    
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      access: unrestricted
  info:
    env:
      enabled: true
info:
  app:
    name: "Accounts Service"
    description: "This is the Accounts Service for EasyBank Application"
    version: 1.0.0

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
