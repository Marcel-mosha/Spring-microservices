server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  profiles:
    active: prod


build:
  version: 3.0.0

accounts:
  message: "Welcome to the Accounts Service"
  contactDetails:
    name: "Accounts Support"
    email: "accounts@example.com"
  onCallSupport:
    - 07222222334
    - 07222222335
