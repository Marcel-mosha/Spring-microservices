spring:
  application:
    name: configServer
  profiles:
    active: git
  #active: native
  cloud:
    config:
      server:
        #native:
          #search-locations: classpath:/config
          #search-locations: file:///home/mr_cel13/spring/microservices/config
        git:
          uri: "git@github.com:Marcel-mosha/EasyBank-Config.git"
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true
        monitor:
          validation-filter-enabled: false
          github:
            validation-enabled: false

#  rabbitmq:
#    host: "localhost"
#    port: 5672
#    username: "guest"
#    password: "guest"



  management:
    endpoints:
      web:
        exposure:
          include: "*"
    health:
      readinessstate:
        enabled: true
      livenessstate:
        enabled: true
    endpoint:
      health:
        probes:
          enabled: true
encrypt:
  key: "857dc862b6f6b138652e23d23cd089e07d58e813c047eb6de7903b1f140f30fd"

server:
  port: 8071
  
management:
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment: "development"
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        step: 10s
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: ${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) %magenta([traceId=%X{traceId:-},spanId=%X{spanId:-}]) - %cyan(%msg%n)}

